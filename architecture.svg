<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AC-DAG Architecture</title>
  <desc>Five-layer pipeline: Encoder, DAG Builder, RL Policy, Aggregator, LLM Interface</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555; }
    .label { font-size: 11px; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="680" height="780" fill="#ffffff"/>

  <!-- Query Input -->
  <rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="47" text-anchor="middle">Query input</text>
  <line x1="340" y1="64" x2="340" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 1: Encoder -->
  <rect x="40" y="88" width="600" height="110" rx="10" fill="none" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="label" x="58" y="107" fill="#7F77DD">1 — Encoder layer</text>

  <rect x="60" y="114" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="145" y="147" text-anchor="middle" fill="#3C3489">SBERT</text>
  <text class="ts" x="145" y="167" text-anchor="middle" fill="#534AB7">Text chunk embeddings</text>

  <rect x="255" y="114" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="147" text-anchor="middle" fill="#3C3489">CLIP</text>
  <text class="ts" x="340" y="167" text-anchor="middle" fill="#534AB7">Image chunk embeddings</text>

  <rect x="450" y="114" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="535" y="147" text-anchor="middle" fill="#3C3489">Timestamp enc.</text>
  <text class="ts" x="535" y="167" text-anchor="middle" fill="#534AB7">Handles modality drift</text>

  <line x1="145" y1="186" x2="145" y2="228" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="340" y1="186" x2="340" y2="228" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="535" y1="186" x2="535" y2="228" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Layer 2: DAG Builder -->
  <rect x="40" y="228" width="600" height="110" rx="10" fill="none" stroke="#5DCAA5" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="label" x="58" y="247" fill="#1D9E75">2 — DAG builder</text>

  <rect x="60" y="254" width="210" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="165" y="287" text-anchor="middle" fill="#085041">Multi-modal nodes</text>
  <text class="ts" x="165" y="307" text-anchor="middle" fill="#0F6E56">Text + image chunks → DAG</text>

  <rect x="295" y="254" width="210" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="400" y="287" text-anchor="middle" fill="#085041">GNN edge weights</text>
  <text class="ts" x="400" y="307" text-anchor="middle" fill="#0F6E56">GraphSAGE, cosine init</text>

  <rect x="530" y="254" width="110" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="585" y="287" text-anchor="middle" fill="#085041">Cos. sim.</text>
  <text class="ts" x="585" y="307" text-anchor="middle" fill="#0F6E56">Edge init</text>

  <line x1="270" y1="290" x2="293" y2="290" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="505" y1="290" x2="528" y2="290" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="340" y1="338" x2="340" y2="368" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Layer 3: RL Policy -->
  <rect x="40" y="368" width="600" height="118" rx="10" fill="none" stroke="#F0997B" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="label" x="58" y="387" fill="#D85A30">3 — RL policy traversal (PPO)</text>

  <rect x="60" y="394" width="155" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="137" y="427" text-anchor="middle" fill="#712B13">State</text>
  <text class="ts" x="137" y="447" text-anchor="middle" fill="#993C1D">Node emb.</text>
  <text class="ts" x="137" y="463" text-anchor="middle" fill="#993C1D">+ query emb.</text>

  <rect x="263" y="394" width="155" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="340" y="427" text-anchor="middle" fill="#712B13">Action</text>
  <text class="ts" x="340" y="447" text-anchor="middle" fill="#993C1D">Next node</text>
  <text class="ts" x="340" y="463" text-anchor="middle" fill="#993C1D">selection + prune</text>

  <rect x="466" y="394" width="155" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="543" y="427" text-anchor="middle" fill="#712B13">Reward</text>
  <text class="ts" x="543" y="447" text-anchor="middle" fill="#993C1D">LLM reasoning</text>
  <text class="ts" x="543" y="463" text-anchor="middle" fill="#993C1D">quality (task success)</text>

  <line x1="215" y1="434" x2="261" y2="434" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
  <line x1="418" y1="434" x2="464" y2="434" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
  <line x1="340" y1="486" x2="340" y2="516" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow-coral)"/>

  <!-- Layer 4: Aggregator -->
  <rect x="40" y="516" width="600" height="88" rx="10" fill="none" stroke="#FAC775" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="label" x="58" y="535" fill="#BA7517">4 — Aggregator</text>

  <rect x="100" y="542" width="480" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="340" y="567" text-anchor="middle" fill="#633806">Cross-modal multi-head attention</text>
  <text class="ts" x="340" y="585" text-anchor="middle" fill="#854F0B">Selected DAG path → fused context vector</text>

  <line x1="340" y1="604" x2="340" y2="634" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Layer 5: LLM Interface -->
  <rect x="40" y="634" width="600" height="88" rx="10" fill="none" stroke="#85B7EB" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="label" x="58" y="653" fill="#185FA5">5 — LLM interface</text>

  <rect x="100" y="660" width="480" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340" y="685" text-anchor="middle" fill="#0C447C">Fused context → prefix injection</text>
  <text class="ts" x="340" y="703" text-anchor="middle" fill="#185FA5">LLaMA-3 / Mistral — any instruction-tuned LLM</text>

  <!-- Output -->
  <line x1="340" y1="722" x2="340" y2="750" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="230" y="750" width="220" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="ts" x="340" y="768" text-anchor="middle" fill="#2C2C2A">Reasoned LLM output</text>
</svg>
